[simulation]
name = "Figure-Eight INS Error Propagation"
runs = 100
seed = 20260924
sample_period_s = 0.1
duration_s = 360.0
altitude_aiding = true
output_dir = "results/figure_eight"

[scenario]
name = "figure_eight"
origin_lat_deg = 40.0
origin_lon_deg = -80.0
origin_hae_m = 250.0
radius_m = 1000.0
altitude_amplitude_m = 100.0

[initial_error]
position_std = [1.0, 1.0, 2.0]
velocity_std = [0.05, 0.05, 0.05]
attitude_std_deg = [0.05, 0.05, 0.10]

[sensors.gyro]
constant_bias_std = [1.0e-5, 1.0e-5, 1.0e-5]
fogm_sigma = [5.0e-6, 5.0e-6, 5.0e-6]
fogm_tau_s = [300.0, 300.0, 300.0]
angle_random_walk = [3.0e-5, 3.0e-5, 3.0e-5]
bias_rate_random_walk = [5.0e-7, 5.0e-7, 5.0e-7]

[sensors.accel]
constant_bias_std = [0.005, 0.005, 0.005]
fogm_sigma = [0.002, 0.002, 0.002]
fogm_tau_s = [300.0, 300.0, 300.0]
velocity_random_walk = [0.001, 0.001, 0.001]
bias_rate_random_walk = [1.0e-4, 1.0e-4, 1.0e-4]
