[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strapdown-ins-monte-carlo"
version = "0.1.0"
description = "Configuration-driven Monte Carlo simulation for strapdown inertial navigation error propagation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "r3f",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ins-monte-carlo = "ins.cli:main"

[project.gui-scripts]
ins-monte-carlo-gui = "ins.gui:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ins = ["web/*.html"]
